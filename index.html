    <!-- Meta Pixel Code with Strict Protection against premature Purchase on #order_form -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      
      // 1. Disable autoConfig so Meta Pixel does NOT automatically guess/trigger Purchase on buttons/forms
      fbq('set', 'autoConfig', false, '28477410788542282');
      fbq('init', '28477410788542282');

      // 2. Extract test_event_code from URL or sessionStorage and register it if present
      try {
        var urlParams = new URLSearchParams(window.location.search);
        var testCode = urlParams.get('test_event_code') || urlParams.get('testEventCode');
        if (testCode) {
          sessionStorage.setItem('meta_test_event_code', testCode);
        } else {
          testCode = sessionStorage.getItem('meta_test_event_code');
        }
        if (testCode) {
          fbq('dataProcessingOptions', []);
        }
      } catch (e) {}

      fbq('track', 'PageView');

      // 3. Strict Interceptor Guard: Block Purchase event if NOT on the Thank You page
      (function() {
        var nativeFbq = window.fbq;
        window.fbq = function() {
          var action = arguments[0];
          var eventName = arguments[1];
          if (action === 'track' && eventName === 'Purchase') {
            var isThankYou = window.location.pathname.indexOf('thank-you') !== -1 ||
                             window.location.search.indexOf('order_id') !== -1 ||
                             window.location.hash.indexOf('thank-you') !== -1;

            if (!isThankYou) {
              console.warn(
                '[Meta Pixel Guard] BLOCKED Purchase event on landing page / order form! Purchase is strictly permitted only on the Thank You page after order placement.'
              );
              return;
            }
          }
          return nativeFbq.apply(window, arguments);
        };
      })();
    </script>
